<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
  <title id="t">jvs4nt — terminal</title>
  <desc id="d">Animated terminal. whoami: João Santos, full-stack dev at 14Mob, Brazil. Stack: React, Next.js, Three.js, React Flow, Tailwind; Node, Fastify, Express; PostgreSQL, Drizzle, Prisma, Supabase, Neon; Vercel, Capacitor, GitHub Actions. Current focus: AI agents and flows, 3D on the web, finance and data viz.</desc>
  <defs>
    <linearGradient id="bar1" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="bar3" x1="0" x2="1"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; }
      .p  { fill: #9ece6a; } .h { fill: #7aa2f7; } .s { fill: #bb9af7; }
      .t  { fill: #c0caf5; } .m { fill: #565f89; } .k { fill: #7dcfff; } .a { fill: #e0af68; }

      .line { animation: line .35s ease-out both; }
      @keyframes line { from { opacity: 0; transform: translateX(-8px); } }

      .type { animation-name: type; animation-fill-mode: both; }
      @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }

      .bar { transform-box: fill-box; transform-origin: left center; animation: bar 1.4s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes bar { from { transform: scaleX(0); } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .cover { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="450" rx="18" fill="#1a1b27"/>
  <path d="M0 18a18 18 0 0 1 18-18h1164a18 18 0 0 1 18 18v26H0z" fill="#16161e"/>
  <circle cx="30" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="22" r="7" fill="#febc2e"/>
  <circle cx="78" cy="22" r="7" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" class="mono m" style="font-size:13px">jvs4nt — zsh — 120×24</text>

  <g class="mono">
    <!-- whoami -->
    <g class="line" style="animation-delay:.3s">
      <text x="40" y="90"><tspan class="p">jvs4nt@14mob</tspan> <tspan class="h">~</tspan> <tspan class="s">$</tspan> <tspan class="t">whoami</tspan></text>
      <rect class="cover type" x="214" y="70" width="80" height="28" fill="#1a1b27" style="--w:80px;animation-duration:.5s;animation-delay:.5s;animation-timing-function:steps(6)"/>
    </g>
    <text class="line t" x="40" y="118" style="animation-delay:1.1s">João Santos <tspan class="m">—</tspan> full-stack dev <tspan class="s">@ 14Mob</tspan><tspan class="m">,</tspan> Brasil <tspan class="m">· fala PT / speaks EN</tspan></text>

    <!-- stack -->
    <g class="line" style="animation-delay:1.5s">
      <text x="40" y="160"><tspan class="p">jvs4nt@14mob</tspan> <tspan class="h">~</tspan> <tspan class="s">$</tspan> <tspan class="t">cat stack.yml</tspan></text>
      <rect class="cover type" x="214" y="140" width="150" height="28" fill="#1a1b27" style="--w:150px;animation-duration:.8s;animation-delay:1.7s;animation-timing-function:steps(13)"/>
    </g>
    <text class="line" x="40" y="188" style="animation-delay:2.6s"><tspan class="k">front</tspan><tspan class="m">:</tspan> <tspan class="t" x="140">React · Next.js · Three.js · React Flow · Tailwind</tspan></text>
    <text class="line" x="40" y="216" style="animation-delay:2.75s"><tspan class="k">back</tspan><tspan class="m">:</tspan>  <tspan class="t" x="140">Node · Fastify · Express</tspan></text>
    <text class="line" x="40" y="244" style="animation-delay:2.9s"><tspan class="k">data</tspan><tspan class="m">:</tspan>  <tspan class="t" x="140">PostgreSQL · Drizzle · Prisma · Supabase · Neon</tspan></text>
    <text class="line" x="40" y="272" style="animation-delay:3.05s"><tspan class="k">ship</tspan><tspan class="m">:</tspan>  <tspan class="t" x="140">Vercel · Capacitor (Android) · GitHub Actions</tspan></text>

    <!-- focus -->
    <g class="line" style="animation-delay:3.5s">
      <text x="40" y="314"><tspan class="p">jvs4nt@14mob</tspan> <tspan class="h">~</tspan> <tspan class="s">$</tspan> <tspan class="t">./now --focus</tspan></text>
      <rect class="cover type" x="214" y="294" width="150" height="28" fill="#1a1b27" style="--w:150px;animation-duration:.8s;animation-delay:3.7s;animation-timing-function:steps(13)"/>
    </g>

    <g class="line" style="animation-delay:4.6s">
      <text x="40" y="342" class="t">AI agents &amp; flows</text>
      <rect x="320" y="330" width="480" height="12" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar" x="320" y="330" width="432" height="12" rx="6" fill="url(#bar1)" style="animation-delay:4.7s"/>
      <text x="820" y="342" class="m">shipping</text>
    </g>
    <g class="line" style="animation-delay:4.75s">
      <text x="40" y="370" class="t">3D on the web</text>
      <rect x="320" y="358" width="480" height="12" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar" x="320" y="358" width="360" height="12" rx="6" fill="url(#bar2)" style="animation-delay:4.85s"/>
      <text x="820" y="370" class="m">building</text>
    </g>
    <g class="line" style="animation-delay:4.9s">
      <text x="40" y="398" class="t">Finance &amp; data viz</text>
      <rect x="320" y="386" width="480" height="12" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar" x="320" y="386" width="312" height="12" rx="6" fill="url(#bar3)" style="animation-delay:5s"/>
      <text x="820" y="398" class="m">iterating</text>
    </g>

    <g class="line" style="animation-delay:5.6s">
      <text x="40" y="430"><tspan class="p">jvs4nt@14mob</tspan> <tspan class="h">~</tspan> <tspan class="s">$</tspan></text>
      <rect class="cursor" x="216" y="414" width="10" height="20" fill="#c0caf5"/>
    </g>
  </g>
</svg>
