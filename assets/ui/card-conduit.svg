      <circle cx="38" cy="198.0" r="6" fill="#e0af68"/>
      <text x="52" y="203.0" class="mono" font-size="14" font-weight="700" fill="#c0caf5">Memory</text>
      
    </g>
    <rect class="agent-glow" x="180" y="96" width="140" height="60" rx="12" fill="none" stroke="#7c3aed" stroke-width="6" filter="url(#glow)"/>
    <g class="">
      <rect x="180" y="96" width="140" height="60" rx="10" fill="#24283b" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="198" cy="126.0" r="6" fill="#a78bfa"/>
      <text x="212" y="122.0" class="mono" font-size="14" font-weight="700" fill="#c0caf5">AI Agent</text>
      <text x="212" y="140.0" class="mono" font-size="11" fill="#737aa2">llm · tools</text>
    </g>
    <g class="">
      <rect x="360" y="32" width="84" height="44" rx="10" fill="#24283b" stroke="#7dcfff" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="378" cy="54.0" r="6" fill="#7dcfff"/>
      <text x="392" y="59.0" class="mono" font-size="14" font-weight="700" fill="#c0caf5">Reply</text>
      
    </g>
    <g class="">
      <rect x="360" y="176" width="84" height="44" rx="10" fill="#24283b" stroke="#f472b6" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="378" cy="198.0" r="6" fill="#f472b6"/>
      <text x="392" y="203.0" class="mono" font-size="14" font-weight="700" fill="#c0caf5">CRM</text>
      
    </g>
    <circle class="smil" r="5" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M140 54 C 170 54 150 126 180 126 L320 126 C 350 126 330 54 360 54"/>
    </circle>
    <circle class="smil" r="4" fill="#f472b6" filter="url(#glow)">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M140 198 C 170 198 150 126 180 126 L320 126 C 350 126 330 198 360 198"/>
