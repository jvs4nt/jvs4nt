<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Conduit</title>
  <desc id="d">Builder visual de fluxos conversacionais com agentes de IA / Visual conversational flow builder with AI agents — React · Vite · Fastify · Drizzle · PostgreSQL · React Flow</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .streak { animation: streak 7s linear infinite; }
      @keyframes streak { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .enter { animation: enter .8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
      .cta { animation: cta 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes cta { 50% { transform: scale(1.04); } }

      .flow { animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .agent-glow { animation: agent 2.4s ease-in-out infinite; opacity: .35; }
      @keyframes agent { 50% { opacity: .9; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .smil { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="#1a1b27"/>
  <rect width="1200" height="300" rx="22" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect class="streak" x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="url(#streak)" stroke-width="2" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"/>

  <g class="enter">
    <rect x="56" y="40" width="84" height="28" rx="14" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.45"/><text x="98" y="59" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" letter-spacing="1" fill="#94a3b8">PRIVATE</text><rect x="149.60000000000002" y="40" width="110" height="28" rx="14" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.45"/><text x="205" y="59" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" letter-spacing="1" fill="#a78bfa">AI · FLOWS</text>
    <text x="54" y="122" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#ffffff">Conduit</text>
  </g>
  <g class="enter" style="animation-delay:.15s">
    <text x="56" y="164" class="sans" font-size="19" fill="#c0caf5"><tspan class="mono" font-size="13" fill="#a78bfa" font-weight="700">PT  </tspan>Builder visual de fluxos conversacionais com agentes de IA</text>
    <text x="56" y="194" class="sans" font-size="19" fill="#9aa5ce"><tspan class="mono" font-size="13" fill="#a78bfa" font-weight="700">EN  </tspan>Visual conversational flow builder with AI agents</text>
    <text x="56" y="228" class="mono" font-size="14.5" fill="#737aa2">React · Vite · Fastify · Drizzle · PostgreSQL · React Flow</text>
  </g>
  <g class="enter" style="animation-delay:.3s"><g class="cta"><rect x="56" y="246" width="145" height="34" rx="17" fill="url(#accent)"/><text x="129" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ffffff">▶  Live demo</text></g><text x="217" y="268" class="mono" font-size="14" fill="#737aa2">conduit-mu-six.vercel.app</text></g>

  <g transform="translate(700 24)">
    <rect width="460" height="252" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect width="460" height="252" rx="16" fill="url(#dots)"/>
    <path d="M140 54 C 170 54 150 126 180 126" fill="none" stroke="#414868" stroke-width="2"/><path class="flow" d="M140 54 C 170 54 150 126 180 126" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 8"/><path d="M320 126 C 350 126 330 54 360 54" fill="none" stroke="#414868" stroke-width="2"/><path class="flow" d="M320 126 C 350 126 330 54 360 54" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 8"/><path d="M320 126 C 350 126 330 198 360 198" fill="none" stroke="#414868" stroke-width="2"/><path class="flow" d="M320 126 C 350 126 330 198 360 198" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 8"/><path d="M140 198 C 170 198 150 126 180 126" fill="none" stroke="#414868" stroke-width="2"/><path class="flow" d="M140 198 C 170 198 150 126 180 126" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 8"/>
    <g class="">
      <rect x="20" y="32" width="120" height="44" rx="10" fill="#24283b" stroke="#22c55e" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="38" cy="54.0" r="6" fill="#22c55e"/>
      <text x="52" y="59.0" class="mono" font-size="14" font-weight="700" fill="#c0caf5">Trigger</text>
      
    </g>
    <g class="">
