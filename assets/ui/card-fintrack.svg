<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">FinTrack</title>
  <desc id="d">Organizador financeiro: ganhos, gastos, cartões e reservas / Personal finance organizer: income, expenses, cards, savings — React · Vite · Express · Prisma · Supabase</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .streak { animation: streak 7s linear infinite; }
      @keyframes streak { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .enter { animation: enter .8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
      .cta { animation: cta 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes cta { 50% { transform: scale(1.04); } }

      .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 4.8s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18%, 82% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
      .line { stroke-dasharray: 100; animation: line 4.8s ease-out infinite; }
      @keyframes line { 0%, 15% { stroke-dashoffset: 100; } 45%, 82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
      .dot { animation: dot 4.8s ease-out infinite; }
      @keyframes dot { 0%, 25% { opacity: 0; } 45%, 82% { opacity: 1; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .smil { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="#1a1b27"/>
  <rect width="1200" height="300" rx="22" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect class="streak" x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="url(#streak)" stroke-width="2" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"/>

  <g class="enter">
    <rect x="56" y="40" width="75" height="28" rx="14" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.45"/><text x="93" y="59" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" letter-spacing="1" fill="#4ade80">PUBLIC</text><rect x="140.8" y="40" width="84" height="28" rx="14" fill="#fcd34d" fill-opacity="0.14" stroke="#fcd34d" stroke-opacity="0.45"/><text x="183" y="59" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" letter-spacing="1" fill="#fcd34d">FINANCE</text>
    <text x="54" y="122" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#ffffff">FinTrack</text>
  </g>
  <g class="enter" style="animation-delay:.15s">
    <text x="56" y="164" class="sans" font-size="19" fill="#c0caf5"><tspan class="mono" font-size="13" fill="#fcd34d" font-weight="700">PT  </tspan>Organizador financeiro: ganhos, gastos, cartões e reservas</text>
    <text x="56" y="194" class="sans" font-size="19" fill="#9aa5ce"><tspan class="mono" font-size="13" fill="#fcd34d" font-weight="700">EN  </tspan>Personal finance organizer: income, expenses, cards, savings</text>
    <text x="56" y="228" class="mono" font-size="14.5" fill="#737aa2">React · Vite · Express · Prisma · Supabase</text>
  </g>
  <g class="enter" style="animation-delay:.3s"><g class="cta"><rect x="56" y="246" width="155" height="34" rx="17" fill="url(#accent)"/><text x="133" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ffffff">★  Repository</text></g><text x="227" y="268" class="mono" font-size="14" fill="#737aa2">github.com/jvs4nt/fintrack</text></g>

  <g transform="translate(700 24)">
    <rect width="460" height="252" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect width="460" height="252" rx="16" fill="url(#dots)"/>
    
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="30" y1="224" x2="430" y2="224"/><line x1="30" y1="174" x2="430" y2="174"/>
      <line x1="30" y1="124" x2="430" y2="124"/><line x1="30" y1="74" x2="430" y2="74"/>
    </g>
    <rect class="bar" style="animation-delay:0.00s" x="40" y="172" width="30" height="52" rx="6" fill="url(#accent)" fill-opacity="0.45"/><rect class="bar" style="animation-delay:0.12s" x="94" y="144" width="30" height="80" rx="6" fill="url(#accent)" fill-opacity="0.53"/><rect class="bar" style="animation-delay:0.24s" x="148" y="162" width="30" height="62" rx="6" fill="url(#accent)" fill-opacity="0.61"/><rect class="bar" style="animation-delay:0.36s" x="202" y="118" width="30" height="106" rx="6" fill="url(#accent)" fill-opacity="0.69"/><rect class="bar" style="animation-delay:0.48s" x="256" y="138" width="30" height="86" rx="6" fill="url(#accent)" fill-opacity="0.77"/><rect class="bar" style="animation-delay:0.60s" x="310" y="100" width="30" height="124" rx="6" fill="url(#accent)" fill-opacity="0.85"/><rect class="bar" style="animation-delay:0.72s" x="364" y="112" width="30" height="112" rx="6" fill="url(#accent)" fill-opacity="0.93"/>
    <path class="line" pathLength="100" d="M55,154 L109,126 L163,144 L217,100 L271,120 L325,82 L379,94" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="dot" style="animation-delay:1.2s" cx="55" cy="154" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.3s" cx="109" cy="126" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.4s" cx="163" cy="144" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.5s" cx="217" cy="100" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.6s" cx="271" cy="120" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.7s" cx="325" cy="82" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/><circle class="dot" style="animation-delay:1.8s" cx="379" cy="94" r="4" fill="#1a1b27" stroke="#fde68a" stroke-width="2"/>
    <g transform="translate(24 20)">
      <text class="mono" font-size="12" fill="#737aa2">saldo · balance</text>
      <text y="30" class="sans" font-size="26" font-weight="800" fill="#ffffff">R$ 12.480,00</text>
      <g transform="translate(196 12)">
        <rect width="78" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.5"/>
        <text x="39" y="16.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#4ade80">▲ 12%</text>
      </g>
    </g>
    <g transform="translate(330 22)" class="mono" font-size="11" fill="#9aa5ce">
      <circle cx="5" cy="-4" r="4" fill="#f59e0b"/><text x="14">ganhos</text>
      <circle cx="5" cy="14" r="4" fill="#fde68a"/><text x="14" y="18">reservas</text>
    </g>

  </g>
</svg>
