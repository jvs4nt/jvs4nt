    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .streak { animation: streak 7s linear infinite; }
      @keyframes streak { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .enter { animation: enter .8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
      .cta { animation: cta 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes cta { 50% { transform: scale(1.04); } }

      .draw { stroke-dasharray: 100; animation: draw 1.6s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 100; fill-opacity: 0; } }
      .pop { animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center bottom; }
      .p1 { animation-delay: .9s; } .p2 { animation-delay: 1.1s; } .p3 { animation-delay: 1.3s; }
      @keyframes pop { from { opacity: 0; transform: translateY(-30px); } }
      .float { animation: float 3.2s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-12px); } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .smil { display: none; }
      }
    </style>
  </defs>

