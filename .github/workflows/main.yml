name: Generate README assets

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jvs4nt&show_icons=true&theme=tokyonight&hide_border=true&border_radius=16&include_all_commits=true&count_private=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jvs4nt&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&border_radius=16
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: jvs4nt
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=#7C3AED&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
            assets/snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: jvs4nt

      - name: Keep only the 3D variants used by the README
        run: |
          mkdir -p assets/3d
          mv profile-3d-contrib/profile-night-rainbow.svg assets/3d/contrib-dark.svg
          mv profile-3d-contrib/profile-green-animate.svg assets/3d/contrib-light.svg
          rm -rf profile-3d-contrib

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: update README assets" || exit 0
          git pull --rebase origin main
          git push
